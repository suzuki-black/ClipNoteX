[workspace]
resolver = "2"
members = [
    "crates/clipnotex-core",
    "crates/clipnotex-clipboard",
    "crates/clipnotex-store",
    "crates/clipnotex-hotkey",
    "crates/clipnotex-paste",
    "crates/clipnotex-format",
    "crates/clipnotex-donelog",
    "crates/clipnotex-app",
    "crates/clipnotex-ffi",
    "tools/devcli",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/suzuki-black/ClipNoteX"
homepage = "https://github.com/suzuki-black/ClipNoteX"

[workspace.dependencies]
# internal
clipnotex-core      = { path = "crates/clipnotex-core" }
clipnotex-clipboard = { path = "crates/clipnotex-clipboard" }
clipnotex-store     = { path = "crates/clipnotex-store" }
clipnotex-hotkey    = { path = "crates/clipnotex-hotkey" }
clipnotex-paste     = { path = "crates/clipnotex-paste" }
clipnotex-format    = { path = "crates/clipnotex-format" }
clipnotex-donelog   = { path = "crates/clipnotex-donelog" }
clipnotex-app       = { path = "crates/clipnotex-app" }

# core
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bincode     = "1.3"
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
arc-swap    = "1"
parking_lot = "0.12"
once_cell   = "1"

# domain
ulid        = { version = "1", features = ["serde"] }
blake3      = "1"
chrono      = { version = "0.4", features = ["serde"] }

# storage
redb        = "2"
zstd        = "0.13"

# crypto
chacha20poly1305 = "0.10"
argon2      = "0.5"
zeroize     = { version = "1", features = ["derive"] }
rand        = "0.8"
keyring     = "3"

# clipboard / OS
arboard         = "3"
global-hotkey   = "0.6"
tray-icon       = "0.19"
enigo           = "0.3"
image           = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# FFI
libc            = "0.2"

# macOS-specific (declared here so crates can use workspace = true)
objc2            = "0.5"
objc2-app-kit    = { version = "0.2", features = ["NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSWindow", "NSPanel"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSData"] }

# Windows-specific
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
] }
clipboard-win = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 1   # OS API 呼び出しが多いので debug でも 1 にする
