# cbindgen configuration — emits ClipNoteX.h for Swift bridging.
language = "C"
header = """
/* SPDX-License-Identifier: MIT
 * ClipNoteX FFI — C ABI for native frontends.
 * Auto-generated by cbindgen. Do not edit manually.
 */"""
include_guard = "CLIPNOTEX_FFI_H"
pragma_once   = true
cpp_compat    = true
braces        = "SameLine"
line_length   = 100
tab_width     = 4
documentation = true
style         = "type"

[export]
prefix = "Cnx"

[parse]
parse_deps = false

[parse.expand]
crates = []
