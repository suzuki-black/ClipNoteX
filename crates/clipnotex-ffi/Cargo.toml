[package]
name        = "clipnotex-ffi"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
homepage    = { workspace = true }
description = "C ABI layer for Swift/AppKit (macOS) and other native frontends."

[lib]
# staticlib のみ — .a を Swift パッケージから静的リンクする。
# cdylib (dylib) も出すと、Swift ビルドが優先してそちらをリンクし、
# 別チーム ID で署名されたアプリ実行時に "different Team IDs" エラーで
# ロード不可になる。FFI は dylib として配布する必要が無いので外す。
crate-type = ["staticlib", "rlib"]

[dependencies]
clipnotex-core      = { workspace = true }
clipnotex-clipboard = { workspace = true }
clipnotex-store     = { workspace = true }
clipnotex-hotkey    = { workspace = true }
clipnotex-paste     = { workspace = true }
clipnotex-format    = { workspace = true }
clipnotex-donelog   = { workspace = true }
clipnotex-app       = { workspace = true }

serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
chrono      = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
ulid        = { workspace = true }
parking_lot = { workspace = true }
once_cell   = { workspace = true }

libc        = { workspace = true }

[build-dependencies]
cbindgen = "0.27"
